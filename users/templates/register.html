{% extends "base.html" %}
{% load static %}

{% block 'head' %}
<link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
/>
<link rel="stylesheet" href="{% static 'users/css/login-register.css' %}">
{% endblock %}

{% block 'body' %}
<div class="form-container">
    <h1>Registrar</h1>

    {% if messages %}
        {% for message in messages %}
          <section class="alert {{ message.tags }}">{{ message }}</section>
        {% endfor %}
    {% endif %}

    <form action="{% url 'register' %}" method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label for="username">Usuário</label>
          <input
            name="username"
            type="text"
            class="form-control"
            id="username"
            placeholder="Usuário"
            required
            value="{{ username|default:'' }}"
          />
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            name="email"
            type="email"
            class="form-control"
            id="email"
            placeholder="E-mail"
            required
            value="{{ email|default:'' }}"
          />
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input
            name="password"
            type="password"
            class="form-control"
            id="password"
            placeholder="Senha"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirmar senha</label>
          <input
            name="confirm-password"
            type="password"
            class="form-control"
            id="password2"
            placeholder="Confirmar senha"
            required
          />
        </div>

        <button type="submit" class="btnbtn-primary">Cadastrar</button>
    </form>

    <a href="{% url 'login' %}">Já possui uma conta? Faça login</a>
</div>
{% endblock %}
